name: build-windows-exe
# Builds Convergence-1.17-patcher.exe from this repository's own source on a Windows runner, runs the exe's
# self-test on that Windows machine, and uploads it as a build artifact (and, if a release tag is given, to that release).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the exe to (leave empty to only keep it as a build artifact)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install "pyinstaller>=6.10" zstandard cryptography
      - name: Build one-file exe
        shell: pwsh
        run: |
          pyinstaller --onefile --console --clean --noconfirm --name Convergence-1.17-patcher `
            --paths tools --hidden-import regtool --hidden-import zstandard --hidden-import cryptography `
            --add-data "tools/vanilla-regulation-1.16.1-11611000.bin;tools" --add-data "payload;payload" `
            apply_1.17_patch.py
          Get-Item dist\Convergence-1.17-patcher.exe | Format-List Name,Length
          (Get-FileHash dist\Convergence-1.17-patcher.exe -Algorithm SHA256).Hash | Tee-Object -FilePath dist\Convergence-1.17-patcher.exe.sha256
      - name: Self-test the built exe on Windows
        shell: pwsh
        run: |
          dist\Convergence-1.17-patcher.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dist\Convergence-1.17-patcher.exe --help | Select-Object -First 3
      - name: End-to-end run of the exe on Windows (stand-in install built from public data only)
        shell: pwsh
        run: |
          foreach ($ver in @("11701000", "11711000")) {
            $label = if ($ver -eq "11701000") { "Elden Ring 1.17" } else { "Elden Ring 1.17.1" }
            "=============== end-to-end against $label (regulation $ver) ==============="
            $env:E2E_GAME_VERSION = $ver
            $e2e = Join-Path $env:RUNNER_TEMP "e2e-$ver"
            python .github/ci/e2e_setup.py "$e2e"
            $conv = Join-Path $e2e "ELDEN RING\ConvergenceER"
            Copy-Item dist\Convergence-1.17-patcher.exe $conv
            Push-Location $conv
            cmd /c "Convergence-1.17-patcher.exe < nul > run1.txt 2>&1"
            $rc1 = $LASTEXITCODE
            cmd /c "Convergence-1.17-patcher.exe < nul > run2.txt 2>&1"
            $rc2 = $LASTEXITCODE
            Pop-Location
            Get-Content (Join-Path $conv run1.txt) | Where-Object { $_ -notmatch '^\s+[a-z_]+\.param' } | Select-Object -Last 12
            "exit codes: run1=$rc1 run2=$rc2"
            if ($rc1 -ne 0 -or $rc2 -ne 0) { exit 1 }
            python .github/ci/e2e_verify.py "$e2e"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Convergence-1.17-patcher-exe
          path: |
            dist/Convergence-1.17-patcher.exe
            dist/Convergence-1.17-patcher.exe.sha256
          if-no-files-found: error
      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist\Convergence-1.17-patcher.exe --clobber
